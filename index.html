<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Minhas Tarefas</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<!-- Tela de início do iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minhas Tarefas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">

<!-- A cor da barra de status acompanha o fundo do app -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="color-scheme" content="light dark">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="stack" class="stack">

  <!-- ══ Estante de pastas ══ -->
  <!-- Só o título, um botão de nova pasta e as pastas. Nada mais. -->
  <section class="screen" data-screen="shelf">
    <header class="nav">
      <div class="nav-bar">
        <div class="nav-title-inline">Minhas Tarefas</div>
        <div class="nav-actions">
          <button class="nav-btn" data-action="settings" aria-label="Ajustes">
            <svg viewBox="0 0 24 24"><use href="#i-gear"/></svg>
          </button>
          <button class="nav-btn" data-action="new-folder" aria-label="Nova pasta">
            <svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>
          </button>
        </div>
      </div>
      <h1 class="nav-title-large">Minhas Tarefas</h1>
    </header>

    <main class="scroll" id="shelf-scroll">
      <div class="folder-grid" id="folder-grid"></div>
    </main>
  </section>

</div>

<!-- Camadas por cima: pasta abrindo, folhas modais, escrita à mão -->
<div id="overlay-host"></div>
<div id="sheet-host"></div>
<div id="ink-host"></div>
<div id="toast-host" class="toast-host" aria-live="polite"></div>
